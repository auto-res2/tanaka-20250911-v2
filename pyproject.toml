[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ramdit-lite"
version = "0.0.1"
description = "Lightweight RAM-DiT experimental harness for CI"
authors = [{ name="OpenAI", email="example@example.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "torch>=2.0.0",
  "diffusers>=0.24.0",
  "torchvision>=0.15.0",
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
